services:
  mysql:
    image: mysql:8.4
    container_name: nexly-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: apiNexly
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./NexlyBack
      dockerfile: Dockerfile
    container_name: nexly-backend
    restart: unless-stopped
    env_file:
      - ./NexlyBack/.env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/apiNexly?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
