spring.application.name=NexlyBack

# Puerto en el que se ejecutará el servidor de aplicaciones
server.port=8080

# URL de conexión a la base de datos MySQL
spring.datasource.url=${DB_URL}

# Nombre de usuario para la conexión a la base de datos
spring.datasource.username=${DB_USERNAME}

# Contraseña para la conexión a la base de datos
spring.datasource.password=${DB_PASSWORD}

# Controlador de la base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Estrategia de generación del esquema (update: crea/modifica tablas sin borrar datos)
spring.jpa.hibernate.ddl-auto=update

# Carga de datos de prueba (data.sql). 'always' lo ejecuta también en MySQL;
# defer-datasource-initialization=true asegura que se ejecute DESPUÉS de que
# Hibernate haya creado el esquema (de lo contrario fallaría: no existen tablas).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Muestra las sentencias SQL generadas por Hibernate en la consola
spring.jpa.show-sql=true

# Dialecto de la base de datos para que Hibernate genere el SQL adecuado para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Estrategia de nombrado físico para respetar los nombres de tablas definidos en las entidades
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.auth.cookie-name=${AUTH_COOKIE_NAME:nexly_token}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Correo (verificación de cuenta). En desarrollo apunta a Mailpit, un servidor
# SMTP de pruebas que captura los emails en su bandeja web (http://localhost:8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:Nexly <no-reply@nexly.com>}
app.push.vapid.public-key=${VAPID_PUBLIC_KEY}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY}
app.push.vapid.subject=${VAPID_SUBJECT}